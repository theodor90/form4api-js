name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Reads the public OpenAPI spec; needs no secrets.
      - run: npm run codegen:check
      # Offline: no API key in CI, so the live contract stage is skipped. Run the
      # full `npm run release:check` locally with FORM4API_TEST_KEY before publishing.
      - run: npm run release:check -- --offline
